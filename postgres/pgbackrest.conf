# ─────────────────────────────────────────────────────────────────────────────
# Static, non-secret pgBackRest config. repo1-s3-key / repo1-s3-key-secret /
# repo1-s3-bucket are deliberately NOT here — pgBackRest reads those from
# PGBACKREST_REPO1_S3_KEY / PGBACKREST_REPO1_S3_KEY_SECRET /
# PGBACKREST_REPO1_S3_BUCKET env vars instead (set in docker-compose.yml's
# db service from .env), matching how every other secret in this app flows,
# and keeping them out of the baked image.
#
# repo1-s3-uri-style=path and repo1-s3-verify-tls=n are both required for
# MinIO specifically, not the AWS-S3 defaults — MinIO expects path-style
# bucket addressing, and this stack doesn't run TLS between internal
# containers (see README's Status section on TLS).
# ─────────────────────────────────────────────────────────────────────────────

[global]
repo1-type=s3
repo1-s3-endpoint=minio
repo1-s3-port=9000
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-s3-verify-tls=n
repo1-path=/pgbackrest
repo1-retention-full=4

[callowl]
pg1-path=/var/lib/postgresql/data
