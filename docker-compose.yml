# ─────────────────────────────────────────────────────────────────────────────
# Open CDR Platform — local / home-lab stack
#
# Three services: PostgreSQL, the Node/Express API, and an nginx-served React UI.
# A multi-service compose (rather than a single supervisord container) keeps each
# process independently inspectable — handy while prototyping. Works with both
# `docker compose` and `podman-compose`.
#
#   cp .env.example .env      # adjust credentials
#   podman-compose up --build # or: docker compose up --build
#
# Then open the UI at http://localhost:${HTTP_PORT} (default 8080).
# ─────────────────────────────────────────────────────────────────────────────
services:
  db:
    build:
      context: ./postgres
    container_name: opencdr-db
    depends_on:
      - minio
    # Enables continuous WAL archiving to MinIO via pgBackRest (point-in-time
    # recovery — see DISASTER_RECOVERY.md and postgres/pgbackrest.conf).
    # archive_timeout forces a WAL segment switch at least this often even
    # under low write volume — otherwise a quiet period leaves the actual
    # PITR granularity far coarser than the 60s this implies.
    command: >
      postgres
      -c archive_mode=on
      -c "archive_command=pgbackrest --stanza=opencdr archive-push %p"
      -c archive_timeout=60
    environment:
      POSTGRES_DB: "${PGDATABASE:-opencdr}"
      POSTGRES_USER: "${PGUSER:-opencdr}"
      POSTGRES_PASSWORD: "${PGPASSWORD:-opencdr_pass}"
      # pgBackRest reads these rather than pgbackrest.conf, so the secret
      # values stay out of the baked image — see postgres/pgbackrest.conf.
      PGBACKREST_REPO1_S3_KEY: "${MINIO_ROOT_USER:-opencdr-minio}"
      PGBACKREST_REPO1_S3_KEY_SECRET: "${MINIO_ROOT_PASSWORD:-change_me_minio}"
      PGBACKREST_REPO1_S3_BUCKET: "${MINIO_BUCKET:-opencdr-pitr}"
      # Connects as $PGUSER, not the container's default OS user (root) —
      # POSTGRES_USER is the only superuser role that exists (the official
      # image doesn't also create a "postgres" role once it's renamed), and
      # there's no "root" role at all, so an unqualified connection fails
      # auth with "role \"root\" does not exist" before trust/peer rules
      # even come into play.
      PGBACKREST_PG1_USER: "${PGUSER:-opencdr}"
      # How often docker-entrypoint-wrapper.sh's background loop takes a new
      # pgBackRest base backup — separate from BACKUP_INTERVAL_HOURS (the
      # existing pg_dump service), and from WAL archiving itself, which is
      # continuous/automatic via archive_command above, not on this schedule.
      PITR_BACKUP_INTERVAL_HOURS: "${PITR_BACKUP_INTERVAL_HOURS:-24}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-opencdr} -d ${PGDATABASE:-opencdr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: opencdr-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3001"
      NODE_ENV: "${NODE_ENV:-production}"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: "${PGDATABASE:-opencdr}"
      PGUSER: "${PGUSER:-opencdr}"
      PGPASSWORD: "${PGPASSWORD:-opencdr_pass}"
      PGSSL: "false"
      # "*" is fine for a local lab; set to your real origin(s) once this is
      # publicly reachable, as defense in depth (session auth doesn't rely on
      # CORS for protection — cookies aren't sent cross-origin regardless,
      # since this isn't configured with credentials: true).
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      SEED_EXAMPLES: "${SEED_EXAMPLES:-true}"
      # Set to require a key on POST /calls/ingest. Leave unset for open ingest.
      INGEST_API_KEY: "${INGEST_API_KEY:-}"
      # Set to require a key on the admin backup/restore actions (not the
      # read-only list). Strongly recommended once exposed beyond a local lab.
      ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
      BACKUPS_DIR: /app/backups
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
      # Dashboard/API login — always required, no open mode. Bootstrap admin
      # is created on first boot if no users exist yet; see .env.example.
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # How long audit_log entries are kept (pruned on boot and daily).
      AUDIT_LOG_RETENTION_DAYS: "${AUDIT_LOG_RETENTION_DAYS:-90}"
      # Only required if a remote source is configured (⋯ menu → Remote
      # sources) — encrypts that source's own credential at rest.
      REMOTE_SOURCE_ENC_KEY: "${REMOTE_SOURCE_ENC_KEY:-}"
      # Set only during a rotation window — see SECRETS_ROTATION.md.
      REMOTE_SOURCE_ENC_KEY_PREVIOUS: "${REMOTE_SOURCE_ENC_KEY_PREVIOUS:-}"
      REMOTE_SOURCE_REJECTS_RETENTION_DAYS: "${REMOTE_SOURCE_REJECTS_RETENTION_DAYS:-90}"
      # Per-account login lockout, independent of the per-IP rate limit on
      # POST /auth/login.
      LOGIN_LOCKOUT_THRESHOLD: "${LOGIN_LOCKOUT_THRESHOLD:-5}"
      LOGIN_LOCKOUT_DURATION_MINUTES: "${LOGIN_LOCKOUT_DURATION_MINUTES:-15}"
      # Only required if a user enables MFA (⋯ menu → Security) — encrypts
      # that user's TOTP secret at rest.
      MFA_ENC_KEY: "${MFA_ENC_KEY:-}"
      # Set only during a rotation window — see SECRETS_ROTATION.md.
      MFA_ENC_KEY_PREVIOUS: "${MFA_ENC_KEY_PREVIOUS:-}"
    volumes:
      # Read-write: the on-demand backup/restore endpoints write and read here,
      # alongside the scheduled `backup` service. :z (shared label) relabels
      # the host dir for SELinux (podman) since both services mount it.
      - ./backups:/app/backups:z
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: opencdr-frontend
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"
    restart: unless-stopped

  # Self-hosted S3-compatible object storage — the pgBackRest WAL-archiving
  # target for point-in-time recovery (see db's command/environment below
  # and DISASTER_RECOVERY.md). Chosen over SFTP: neither pgBackRest nor
  # WAL-G support SFTP at all, since continuous WAL shipping needs the
  # ordered, retry-safe delivery an object-storage API gives for free.
  # Internal-only (no host port) — same posture as `db`; reach the console
  # via `podman exec` or a temporary port-forward if you ever need it.
  #
  # Custom-built (see minio/Dockerfile) to bake in a self-signed TLS cert —
  # pgBackRest's S3 driver always speaks TLS (repo1-s3-verify-tls=n in
  # postgres/pgbackrest.conf only skips certificate *verification*, it
  # doesn't drop encryption), so MinIO has to actually terminate TLS or
  # every pgBackRest connection fails with "TLS error ... wrong version
  # number" — confirmed the hard way, not assumed up front.
  minio:
    build:
      context: ./minio
    container_name: opencdr-minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-opencdr-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-change_me_minio}"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # One-shot: creates the PITR bucket, then exits. MinIO doesn't auto-create
  # buckets, and `db`'s own pgbackrest loop retries stanza-create until the
  # bucket exists, so this doesn't need to be perfectly ordered before `db`
  # starts — just needs to succeed eventually.
  minio-init:
    image: minio/mc:latest
    container_name: opencdr-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-opencdr-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-change_me_minio}"
      MINIO_BUCKET: "${MINIO_BUCKET:-opencdr-pitr}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set --insecure local https://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "[minio-init] minio not ready, retrying in 3s..."
          sleep 3
        done
        mc mb --insecure --ignore-existing "local/$$MINIO_BUCKET"
        echo "[minio-init] bucket $$MINIO_BUCKET ready"
    restart: "no"

  # Scheduled pg_dump on a loop (no cron daemon needed) + retention pruning.
  # postgres:16-alpine already ships pg_dump/pg_restore, so it doubles as the
  # image for one-off manual restores: see scripts/restore.sh. Separate from
  # (and unaffected by) db's own pgBackRest/PITR setup below — a portable
  # logical dump has real value PITR doesn't replace, see DISASTER_RECOVERY.md.
  backup:
    image: postgres:16-alpine
    container_name: opencdr-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: "${PGDATABASE:-opencdr}"
      PGUSER: "${PGUSER:-opencdr}"
      PGPASSWORD: "${PGPASSWORD:-opencdr_pass}"
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
    volumes:
      - ./backups:/backups:z
      - ./scripts:/scripts:ro,Z
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          sh /scripts/backup.sh || echo "[backup] run failed, will retry next interval"
          sleep "$$(( BACKUP_INTERVAL_HOURS * 3600 ))"
        done
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
