# Serves the built SPA and reverse-proxies the CDR API to the backend service,
# over HTTPS by default (self-signed cert generated by docker-entrypoint.sh on
# first boot — see that script for why it's persisted in a named volume rather
# than regenerated every container recreate). Plain HTTP is kept only as a
# redirect target, not a second way to actually reach the app.
#
# __HTTPS_PORT__ below is substituted by docker-entrypoint.sh from $HTTPS_PORT
# at container start, not nginx's own templating (nginx's built-in envsubst
# would just as happily mangle the *real* nginx variables below — $host,
# $request_uri, etc — since it substitutes everything present in the
# environment unless narrowed with NGINX_ENVSUBST_FILTER; a plain sed with a
# non-$-prefixed token sidesteps that entirely).
server {
    listen 80;
    server_name _;
    # A redirect to plain "https://$host$request_uri" would silently target
    # the wrong external port whenever HTTPS_PORT isn't 443 — nginx has no
    # visibility into compose's host-port mapping. Explicit :443 when
    # HTTPS_PORT=443 is a harmless no-op; browsers treat it the same as
    # omitting it.
    return 301 https://$host:__HTTPS_PORT__$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Self-signed by default, so this doesn't prevent a downgrade path today
    # (a browser will warn on the cert either way) — but it does tell the
    # browser to remember "always HTTPS for this host" once someone's
    # accepted it once, worth the one line. No includeSubDomains/preload:
    # this is generic self-hosted software at whatever hostname an operator
    # chooses (server_name _), and both of those can break unrelated
    # services sharing the same parent domain.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── Frontend (React SPA) ───────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container. "backend" is the compose service
    # name; Docker/Podman's internal DNS resolves it on the shared network.
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 150s — comfortably above the on-demand custom-script poll's own
        # worst case (SCRIPT_TIMEOUT_MS 120s + SCRIPT_KILL_GRACE_MS 5s in
        # backend/src/services/remoteScriptRunner.ts), so a legitimately
        # slow-but-still-running script doesn't get a spurious 504 here while
        # the backend is still correctly working on it server-side.
        proxy_read_timeout 150s;
    }
}
